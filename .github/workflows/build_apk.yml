name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify Gradle Wrapper
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Clear Gradle 8.2 distribution cache
        run: rm -rf "$HOME/.gradle/wrapper/dists/gradle-8.2-bin"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CargoManifest-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
