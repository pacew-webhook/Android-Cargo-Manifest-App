name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Scan BTB sources
        shell: bash
        run: |
          set -e
          if grep -RIn --exclude-dir=.git --include='*.kt' 'CameraAlt\|Icons\.Filled\.CameraAlt\|material\.icons\.filled\.CameraAlt' app/src/main/java; then
            echo 'ERROR: Legacy CameraAlt reference found in Kotlin sources.'
            exit 1
          fi
          grep -RIn --include='*.kt' 'fun applyScannedWeights' app/src/main/java/com/example/cargomanifestapp/StowingViewModel.kt
          test -f app/src/main/java/com/example/cargomanifestapp/BtbOcrScanner.kt

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug --stacktrace -PGEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CargoManifest-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
